# Runs every test on a real Windows, a real Mac and Linux, on each upload to GitHub (and when you press "Run workflow").
# It starts the app, drives it in a browser exactly like a teacher would, and keeps the screenshots as "Artifacts".
# A green tick = it works on that system. A red cross = open the run, and send the red lines to Claude.
name: Check
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements.txt playwright pyyaml
      - name: Browser for the screen tests
        run: python -m playwright install --with-deps chromium
      - name: Code checker (unused names, hidden errors)
        if: runner.os == 'Linux'
        run: python -m pip install ruff && ruff check app scripts tests
      - name: Workflow files (GitHub's own rules)
        if: runner.os == 'Linux'
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -shellcheck= -pyflakes=
      - name: Translations (every text in English and Arabic)
        if: runner.os == 'Linux'
        run: sh scripts/check_i18n.sh
      - name: Unit tests (also the code-health rules)
        run: python -m unittest discover -s tests
      - name: A school year of data, many requests at once, a folder name in Arabic, a damaged file
        run: python scripts/stress.py
      - name: Screen tests (the whole app, Arabic and English)
        run: python scripts/e2e.py
        env:
          SHOTS: ${{ runner.temp }}/shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
