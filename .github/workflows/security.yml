# Every Monday: asks a public list of known security problems whether any library we use is on it.
# Green = none. Red = open the run to see which library and which version fixes it, and send the red lines to Claude.
name: Security check
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install pip-audit
      - name: Known problems in the libraries we use
        run: pip-audit -r requirements.txt
