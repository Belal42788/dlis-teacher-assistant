# Builds the family app for Android from the portal folder. Press "Run workflow"; when it is green, download the artifact
# "DLIS-Android-APK", copy app-debug.apk to a phone and open it. (This is a test-and-share build, not a Google Play build.)
name: Build Android app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: The app is the portal, nothing else
        run: |
          rm -rf www && mkdir www && cp -r ../portal/. www/
          rm -f www/latest.json
      - run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and loading screen (the school logo)
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#eef5fa' --splashBackgroundColorDark '#eef5fa'
      - name: The page text keeps its own size (the portal has a text size setting; the phone's font size must not double it)
        run: |
          cat > android/app/src/main/java/com/dlis/family/MainActivity.java <<'JAVA'
          package com.dlis.family;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().getSettings().setTextZoom(100);
                  }
              }
          }
          JAVA
      - name: Put the portal into the app
        run: npx cap sync android
      - name: Build the APK
        working-directory: android_app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: DLIS-Android-APK
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
