# Keeps the free Supabase project from being paused for inactivity: pings the school server every 3 days.
# One-time: repo -> Settings -> Secrets and variables -> Actions -> add two secrets:
#   SUPABASE_URL  (https://xxxx.supabase.co)   and   SUPABASE_ANON_KEY  (the public anon key)
name: Keep school server awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets are not set yet"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/announcements?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" -lt 500
