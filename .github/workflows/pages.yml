# Publishes ONLY the "portal" folder (the parents' website) to GitHub Pages.
# One-time: GitHub repo -> Settings -> Pages -> Source: "GitHub Actions".
name: Publish parents portal
on:
  push:
    branches: [main, master]
    paths: ["portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: portal
      - id: deployment
        uses: actions/deploy-pages@v5
