# Publishes ONLY the "portal" folder (the parents' website) to GitHub Pages.
# One-time: GitHub repo -> Settings -> Pages -> Source: "GitHub Actions".
# Two jobs (the layout GitHub recommends): one uploads the site, a second one publishes it.
# GitHub sometimes answers "no artifact found" for a few seconds after the upload, so the second job waits and tries up to 3 times.
name: Publish parents portal
on:
  push:
    branches: [main, master]
    paths: ["portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url || steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Wait for the uploaded site to be listed
        run: sleep 25
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait and try again
        if: steps.first.outcome == 'failure'
        run: sleep 40
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait and try the last time
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 60
      - id: final
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
