# Builds the Windows installer and the Mac disk image in the cloud, so nobody needs Python on their own computer.
# To try a build: open the "Actions" tab, choose "Build apps" and press "Run workflow". When it finishes, download the files from "Artifacts".
# To publish a version to teachers: do not use this one, make a "Release" on GitHub (see "Release" workflow, it calls this one).
name: Build apps
on:
  workflow_dispatch:
  workflow_call:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: pyinstaller --noconfirm --clean --windowed --icon resources/icon.ico --name DLIS_Teacher_Assistant --add-data "app/web;app/web" --add-data "resources;resources" --collect-data docx --collect-data certifi --collect-all pypdfium2 --hidden-import webview --hidden-import pystray._win32 run.py
      - name: Check the built program is complete
        shell: pwsh
        run: |
          $env:DLIS_APP_HOME = "$env:RUNNER_TEMP\selftest"
          Start-Process -FilePath "dist\DLIS_Teacher_Assistant\DLIS_Teacher_Assistant.exe" -ArgumentList "--selftest","$env:RUNNER_TEMP\selftest.json" -Wait -NoNewWindow
          if (-not (Test-Path "$env:RUNNER_TEMP\selftest.json")) { Write-Error "The program did not start"; exit 1 }
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ((Get-Content "$env:RUNNER_TEMP\selftest.json" -Raw | ConvertFrom-Json).ok -ne $true) { exit 1 }
      - run: choco install innosetup --no-progress -y
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\dlis.iss'
      - uses: actions/upload-artifact@v7
        with: { name: DLIS-Windows-Setup, path: installer/Output/DLIS_Teacher_Assistant_Setup.exe }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --icon resources/icon.icns --name DLIS_Teacher_Assistant --add-data "app/web:app/web" --add-data "resources:resources" --collect-data docx --collect-data certifi --collect-all pypdfium2 --hidden-import webview run.py
      - name: Check the built program is complete
        run: |
          export DLIS_APP_HOME="$RUNNER_TEMP/selftest"
          dist/DLIS_Teacher_Assistant.app/Contents/MacOS/DLIS_Teacher_Assistant --selftest "$RUNNER_TEMP/selftest.json" || true
          test -f "$RUNNER_TEMP/selftest.json" || { echo "The program did not start"; exit 1; }
          cat "$RUNNER_TEMP/selftest.json"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$RUNNER_TEMP/selftest.json'))['ok'] else 1)"
      - run: hdiutil create -volname "DLIS Teacher Assistant" -srcfolder dist/DLIS_Teacher_Assistant.app -ov -format UDZO dist/DLIS_Teacher_Assistant.dmg
      - uses: actions/upload-artifact@v7
        with: { name: DLIS-Mac, path: dist/DLIS_Teacher_Assistant.dmg }
